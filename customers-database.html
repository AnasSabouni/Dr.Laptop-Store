<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعدة بيانات العملاء | Dr.Laptop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header p {
            color: #64748b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card i {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        .stat-card-value {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-card-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .tools {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .table thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        .table th {
            padding: 15px;
            text-align: right;
            color: #1e293b;
            font-weight: 600;
        }

        .table td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .table tbody tr:hover {
            background: #f8fafc;
        }

        .customer-name {
            font-weight: 600;
            color: #1e293b;
        }

        .phone-link {
            color: #3b82f6;
            text-decoration: none;
            direction: ltr;
            display: inline-block;
        }

        .phone-link:hover {
            text-decoration: underline;
        }

        .province-badge {
            background: #f3e8ff;
            color: #7c3aed;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            display: block;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal {
            background: white;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
        }

        .modal-content {
            padding: 40px 30px;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-field {
            margin-bottom: 20px;
        }

        .modal-field-label {
            color: #475569;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .modal-field-value {
            color: #1e293b;
            font-size: 1.1rem;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

        .items-list {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .items-list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .items-list-item:last-child {
            border-bottom: none;
        }

        .items-list-item-name {
            color: #1e293b;
            font-weight: 500;
        }

        .items-list-item-qty {
            color: #64748b;
        }

        .items-list-item-price {
            color: #3b82f6;
            font-weight: 600;
        }

        .total-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }

        .total-amount {
            font-size: 1.3rem;
            color: #3b82f6;
            font-weight: 800;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .action-buttons .btn {
            flex: 1;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table {
                font-size: 0.85rem;
            }

            .table th,
            .table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الرأس -->
        <div class="header">
            <h1>
                <i class="fas fa-database"></i>
                قاعدة بيانات العملاء
            </h1>
            <p>إدارة الطلبات والعملاء</p>

            <!-- الإحصائيات -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div class="stat-card-value" id="total-customers">0</div>
                    <div class="stat-card-label">عدد العملاء</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-shopping-bag"></i>
                    <div class="stat-card-value" id="total-orders">0</div>
                    <div class="stat-card-label">عدد الطلبات</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-dollar-sign"></i>
                    <div class="stat-card-value" id="total-revenue">0</div>
                    <div class="stat-card-label">إجمالي المبيعات</div>
                </div>
            </div>
        </div>

        <!-- الأدوات -->
        <div class="tools">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث عن الاسم أو رقم الهاتف...">
                <button class="btn btn-primary" onclick="searchCustomers()">
                    <i class="fas fa-search"></i> بحث
                </button>
            </div>
            <button class="btn btn-success" onclick="exportToCSV()">
                <i class="fas fa-download"></i> تحميل
            </button>
            <button class="btn btn-danger" onclick="clearAllData()">
                <i class="fas fa-trash"></i> حذف الكل
            </button>
        </div>

        <!-- الجدول -->
        <div class="table-container">
            <table class="table" id="customers-table">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>المحافظة</th>
                        <th>المجموع</th>
                        <th>التاريخ</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- البيانات تضاف هنا -->
                </tbody>
            </table>
            <div id="empty-message" class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>لا توجد بيانات</h3>
                <p>لم يتم استقبال أي طلبات حتى الآن</p>
            </div>
        </div>
    </div>

    <script>
        // جلب البيانات من localStorage
        function getCustomersData() {
            const saved = localStorage.getItem('drlaptop-customers');
            return saved ? JSON.parse(saved) : [];
        }

        // تحديث الجدول
        function loadTable(customers = null) {
            const data = customers || getCustomersData();
            const tbody = document.getElementById('table-body');
            const emptyMessage = document.getElementById('empty-message');

            if (data.length === 0) {
                tbody.innerHTML = '';
                emptyMessage.style.display = 'block';
                updateStats([]);
                return;
            }

            emptyMessage.style.display = 'none';
            tbody.innerHTML = data.map((customer, index) => `
                <tr>
                    <td class="customer-name">${customer.name}</td>
                    <td>
                        <a href="tel:${customer.phone}" class="phone-link">
                            <i class="fas fa-phone"></i> ${customer.phone}
                        </a>
                    </td>
                    <td>
                        <span class="province-badge">${customer.province}</span>
                    </td>
                    <td><strong>${customer.totalAmount.toLocaleString('ar-SA')} $</strong></td>
                    <td>${customer.date}</td>
                    <td>
                        <button class="btn btn-primary" onclick="viewDetails(${index})" style="padding: 6px 12px; font-size: 0.9rem;">
                            <i class="fas fa-eye"></i> عرض
                        </button>
                    </td>
                </tr>
            `).join('');

            updateStats(data);
        }

        // تحديث الإحصائيات
        function updateStats(data) {
            const totalCustomers = data.length;
            const totalOrders = data.reduce((sum, customer) => sum + customer.orderItems.length, 0);
            const totalRevenue = data.reduce((sum, customer) => sum + customer.totalAmount, 0);

            document.getElementById('total-customers').textContent = totalCustomers;
            document.getElementById('total-orders').textContent = totalOrders;
            document.getElementById('total-revenue').textContent = totalRevenue.toLocaleString('ar-SA');
        }

        // عرض التفاصيل
        function viewDetails(index) {
            const data = getCustomersData();
            const customer = data[index];

            if (!customer) return;

            const itemsHTML = customer.orderItems.map(item => `
                <div class="items-list-item">
                    <div>
                        <div class="items-list-item-name">${item.name}</div>
                        <div class="items-list-item-qty">الكمية: ${item.quantity}</div>
                    </div>
                    <div class="items-list-item-price">${(item.price * item.quantity).toLocaleString('ar-SA')} $</div>
                </div>
            `).join('');

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                    <div class="modal-content">
                        <h2 class="modal-title">
                            <i class="fas fa-receipt"></i>
                            تفاصيل الطلب
                        </h2>

                        <div class="modal-field">
                            <span class="modal-field-label"><i class="fas fa-user"></i> الاسم</span>
                            <div class="modal-field-value">${customer.name}</div>
                        </div>

                        <div class="modal-field">
                            <span class="modal-field-label"><i class="fas fa-phone"></i> الهاتف</span>
                            <div class="modal-field-value">
                                <a href="tel:${customer.phone}" class="phone-link">${customer.phone}</a>
                            </div>
                        </div>

                        <div class="modal-field">
                            <span class="modal-field-label"><i class="fas fa-map-marker-alt"></i> المحافظة</span>
                            <div class="modal-field-value">${customer.province}</div>
                        </div>

                        ${customer.notes ? `
                            <div class="modal-field">
                                <span class="modal-field-label"><i class="fas fa-sticky-note"></i> ملاحظات</span>
                                <div class="modal-field-value">${customer.notes}</div>
                            </div>
                        ` : ''}

                        <div class="modal-field">
                            <span class="modal-field-label"><i class="fas fa-box"></i> المنتجات</span>
                            <div class="items-list">${itemsHTML}</div>
                        </div>

                        <div class="modal-field total-section">
                            <span class="modal-field-label">المجموع النهائي</span>
                            <div class="total-amount">${customer.totalAmount.toLocaleString('ar-SA')} $</div>
                        </div>

                        <div class="modal-field">
                            <span class="modal-field-label"><i class="fas fa-calendar"></i> التاريخ</span>
                            <div class="modal-field-value">${customer.date}</div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-danger" onclick="deleteCustomer(${index})">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                            <button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">
                                <i class="fas fa-times"></i> إغلاق
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // البحث
        function searchCustomers() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const data = getCustomersData();
            
            const filtered = data.filter(customer =>
                customer.name.toLowerCase().includes(searchTerm) ||
                customer.phone.includes(searchTerm)
            );

            loadTable(filtered);
        }

        // حذف عميل
        function deleteCustomer(index) {
            if (!confirm('هل تريد حذف هذا الطلب؟')) return;

            const data = getCustomersData();
            data.splice(index, 1);
            localStorage.setItem('drlaptop-customers', JSON.stringify(data));
            loadTable();
            alert('تم حذف الطلب');
        }

        // تحميل CSV
        function exportToCSV() {
            const data = getCustomersData();
            if (data.length === 0) {
                alert('لا توجد بيانات للتحميل');
                return;
            }

            let csv = 'الاسم,الهاتف,المحافظة,المجموع,البيانات\n';
            data.forEach(customer => {
                csv += `"${customer.name}","${customer.phone}","${customer.province}","${customer.totalAmount}","${customer.date}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `customers_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // حذف كل البيانات
        function clearAllData() {
            if (!confirm('هل تريد حذف جميع البيانات؟ هذا الإجراء لا يمكن التراجع عنه')) return;
            localStorage.removeItem('drlaptop-customers');
            loadTable();
            alert('تم حذف جميع البيانات');
        }

        // التحميل الأولي
        window.addEventListener('DOMContentLoaded', function() {
            loadTable();
        });
    </script>
</body>
</html>
