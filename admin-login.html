<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Dr.Laptop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            color: #3b82f6;
            font-size: 3rem;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .input-container {
            position: relative;
        }
        
        .input-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        
        input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8fafc;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .login-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #fecaca;
            display: none;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .info-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: right;
            font-size: 0.9rem;
            color: #0369a1;
        }
        
        .back-link {
            display: block;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.9rem;
        }
        
        .back-link:hover {
            color: #3b82f6;
        }
        
        .show-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .logo {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-laptop-medical"></i>
        </div>
        
        <h1>لوحة تحكم Dr.Laptop</h1>
        <p class="subtitle">أدخل بيانات الدخول للوصول إلى لوحة التحكم</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" 
                           placeholder="أدخل اسم المستخدم"
                           autocomplete="username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" 
                           placeholder="أدخل كلمة المرور"
                           autocomplete="current-password" required>
                    <button type="button" class="show-password" id="showPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="login-btn" id="loginButton">
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>
        
        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>
        
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <div>
                <strong>بيانات الدخول الافتراضية:</strong>
                <div style="margin-top: 5px;">
                    اسم المستخدم: <code>AnasSabouni</code><br>
                    كلمة المرور: <code>Anas0217951</code>
                </div>
            </div>
        </div>
        
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-right"></i> العودة للمتجر الرئيسي
        </a>
    </div>

    <!-- مكتبات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="admin-login.js"></script>
    
    <script>
        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const showPasswordBtn = document.getElementById('showPassword');
            const loginButton = document.getElementById('loginButton');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            // التحقق إذا كان المستخدم مسجلاً بالفعل
            if (window.simpleLogin && window.simpleLogin.checkLoginStatus()) {
                window.location.href = 'admin.html';
                return;
            }
            
            // إظهار/إخفاء كلمة المرور
            showPasswordBtn.addEventListener('click', function() {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                this.innerHTML = type === 'password' ? 
                    '<i class="fas fa-eye"></i>' : 
                    '<i class="fas fa-eye-slash"></i>';
            });
            
            // تسجيل الدخول
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                
                if (!username || !password) {
                    showError('الرجاء ملء جميع الحقول');
                    return;
                }
                
                // تغيير حالة الزر
                loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
                loginButton.disabled = true;
                
                // محاكاة وقت التحقق
                await new Promise(resolve => setTimeout(resolve, 800));
                
                // محاولة تسجيل الدخول
                if (window.simpleLogin) {
                    const result = window.simpleLogin.login(username, password);
                    
                    if (result.success) {
                        // نجاح
                        errorDiv.style.display = 'none';
                        loginButton.innerHTML = '<i class="fas fa-check"></i> تم الدخول بنجاح!';
                        loginButton.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                        
                        // التوجيه بعد تأخير قصير
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        // فشل
                        showError(result.message);
                        loginButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                        loginButton.disabled = false;
                    }
                } else {
                    showError('نظام الدخول غير متاح');
                    loginButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                    loginButton.disabled = false;
                }
            });
            
            // إظهار رسالة الخطأ
            function showError(message) {
                errorText.textContent = message;
                errorDiv.style.display = 'block';
                
                // إخفاء الرسالة بعد 5 ثواني
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }
            
            // الدخول باستخدام Enter
            usernameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    passwordInput.focus();
                }
            });
            
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginForm.requestSubmit();
                }
            });
            
            // تركيز على حقل اسم المستخدم
            usernameInput.focus();
        });
    </script>
</body>
</html>
